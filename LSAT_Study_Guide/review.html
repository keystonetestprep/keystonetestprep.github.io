<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Review the LSAT Study Guide | Keystone Test Prep</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #F7F8FA; color: #1F2A44; }
  main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
  .card { background: #FFF9EA; border: 1px solid #F4DFAE; border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.35rem; margin: 0 0 12px; }
  p { line-height: 1.55; }
  a.btn { display: inline-block; margin-top: 8px; padding: 10px 18px; border: 1.5px solid #0F766E; border-radius: 8px; color: #0F766E; font-weight: 600; text-decoration: none; }
  .small { font-size: .9rem; color: #5B6478; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Your Feedback Matters</h1>
    <p>Thank you for using the LSAT Study Guide. You are being taken to Amazon, where you can leave an honest review of the book.</p>
    <a class="btn" id="go" href="#">Continue to Amazon</a>
    <p class="small">If nothing happens, tap the button above. <a href="./">Back to the LSAT study tools</a></p>
  </div>
</main>
<script>
  // Paste the paperback's Amazon review link between the quotes once the book is live
  // (same link as REVIEW_URL in index.html). Leave empty until then: readers get an Amazon search for the book.
  var REVIEW_URL = 'https://www.amazon.com/review/create-review?asin=B0HSRF21P1';
  var FALLBACK = 'https://www.amazon.com/s?k=' + encodeURIComponent('LSAT Study Guide Keystone Test Prep');
  var target = REVIEW_URL || FALLBACK;
  document.getElementById('go').href = target;
  window.location.replace(target);
</script>
</body>
</html>
